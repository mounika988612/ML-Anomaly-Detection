# Explainable self-supervised anomaly detection on CSE-CIC-IDS2018
paths:
  raw_dir: "D:/Thesis source code/dataset/CICIDS2018"
  work_dir: "D:/Thesis source code/anomaly_pipeline/work"
  results_dir: "D:/Thesis source code/anomaly_pipeline/results"

data:
  seed: 42
  # chronological protocol: fit on benign traffic of the earliest days, test on later days
  train_days: [Wednesday-14-02-2018, Thursday-15-02-2018]
  test_days: [Wednesday-21-02-2018, Thursday-22-02-2018, Thursday-01-03-2018, Friday-02-03-2018]
  val_fraction: 0.15          # latest slice of benign train-period traffic (threshold calibration)
  max_train_rows: 300000
  max_sup_rows: 400000        # labelled sample for the supervised baseline
  max_test_rows_per_day: 1100000
  clip: 8.0                   # clip standardised features to +-clip

model:
  hidden: 128
  modality_dim: 32
  latent_dim: 32
  role_dim: 8
  proj_dim: 32
  mask_ratio: 0.25            # masked-feature reconstruction
  modality_dropout: 0.15      # drop a whole modality -> forces cross-modal learning
  contrastive_weight: 0.1
  temperature: 0.2
  epochs: 10
  batch_size: 2048
  lr: 0.001
  weight_decay: 0.00001
  patience: 3

scoring:
  target_fpr: 0.01            # threshold = (1-fpr) quantile of benign validation scores
  xmodal_weight: 0.5
  adapt_window_sec: 1800      # unlabeled start-of-day window used for per-day recalibration
  min_role_samples: 500
  min_scale_ratio: 0.5        # per-role score scale floored at this fraction of the global scale

baselines:
  n_fit_rows: 200000
  iforest_trees: 200
  rf_trees: 100

explain:
  n_alerts: 30
  top_k: 10
  shap_permutations: 40
  lime_samples: 1000
  background_size: 100

report:                       # signature context for the analyst report (Suricata + Zeek run on this victim pcap)
  capture_dir: "D:/Thesis source code/external/pcap/thu22"
  day: Thursday-22-02-2018
  attacker: 18.218.115.60
