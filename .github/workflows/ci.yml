name: CI
on:
  push: { branches: [main, master] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.10", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check ids_pipeline tests run.py
      - name: Tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ids-detect:ci .
      - name: Smoke test the CLI entrypoint
        run: docker run --rm ids-detect:ci --help
