services:
  ids:
    build: .
    image: ids-detect:latest
    ports: ["8080:8080"]
    environment:
      IDS_API_KEYS: ${IDS_API_KEYS:?set IDS_API_KEYS (comma-separated)}
      IDS_MAX_BATCH: "5000"
    volumes:
      - ./models/prod:/models/prod:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "2", memory: 2g }
