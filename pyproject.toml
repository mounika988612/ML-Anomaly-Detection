[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ids-pipeline"
dynamic = ["version"]
description = "Explainable self-supervised, role-aware network anomaly detection: training pipeline and scoring service"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6",
    "torch>=2.2",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
research = ["pyarrow", "scikit-learn", "matplotlib", "lime", "shap"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "scikit-learn", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
ids-detect = "ids_pipeline.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ids_pipeline.__version__" }

[tool.setuptools.packages.find]
include = ["ids_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
extend-exclude = ["work*", "results*", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E741", "B905", "B023", "B008"]

[tool.ruff.lint.per-file-ignores]
# research-code style (dense one-liners); correctness rules stay enabled
"ids_pipeline/{analyst_report,explain,evaluate,train,scoring,signature_compare}.py" = ["E501", "E701", "E702", "E731"]
"ids_pipeline/adapters/*.py" = ["E501"]
